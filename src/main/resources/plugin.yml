name: Minimap
version: '${project.version}'
main: pl.minimap.MinimapPlugin
api-version: '1.21'
description: Minimapa jako przedmiot w lewej ręce - teren, pozycja, kierunek, koordynaty.
commands:
  minimap:
    description: Włącza/wyłącza minimapę, zmienia zoom
    aliases: [m, mm]
    usage: /<command> [zoom [1|2|4|8]] | reload
permissions:
  minimap.use:
    description: Używanie minimapy
    default: true
  minimap.admin:
    description: Przeładowanie konfiguracji
    default: op
